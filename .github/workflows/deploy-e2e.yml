name: Build and use CoursewareHub with the deployment notebooks
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      deploy_repository:
        description: Deploy repository (owner/repository)
        default: NII-cloud-operation/CoursewareHub-LC_deploy
        type: string
      deploy_branch:
        description: Deploy branch
        default: main
        type: string
permissions:
  contents: read
jobs:
  select:
    name: Select deployment notebooks
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.deploy.outputs.repository }}
      sha: ${{ steps.deploy.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deploy
        run: python3 .github/scripts/select-deploy.py

  images:
    name: Build platform images
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build JupyterHub and auth-proxy
        env:
          ATTRIBUTE_AGGREGATOR_URL: ${{ vars.ATTRIBUTE_AGGREGATOR_URL || 'https://github.com/NII-cloud-operation/simplesamlphp-module-attributeaggregator' }}
          ATTRIBUTE_AGGREGATOR_BRANCH: ${{ vars.ATTRIBUTE_AGGREGATOR_BRANCH || 'dev-2.x-gakunin-cloud-gateway' }}
        run: |
          docker build -t "coursewarehub-jupyterhub:$GITHUB_SHA" jupyterhub
          docker build --build-arg ATTRIBUTE_AGGREGATOR_URL --build-arg ATTRIBUTE_AGGREGATOR_BRANCH -t "coursewarehub-auth-proxy:$GITHUB_SHA" auth-proxy
          docker save "coursewarehub-jupyterhub:$GITHUB_SHA" "coursewarehub-auth-proxy:$GITHUB_SHA" | zstd -T0 -1 -o "$RUNNER_TEMP/platform.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-images
          path: ${{ runner.temp }}/platform.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true

  deploy:
    name: ${{ matrix.scenario }}
    needs: [select, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - authentication: local
            scenario: Local login, Moodle LTI and custom images
          - authentication: federation
            scenario: SAML federation
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repository }}
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: platform-images
          path: ${{ runner.temp }}
      - name: Load images built from the platform revision
        run: |
          zstd -dc "$RUNNER_TEMP/platform.tar.zst" | docker load
          rm "$RUNNER_TEMP/platform.tar.zst"
          echo "Platform $GITHUB_SHA; deploy $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./tests/lc4ri/on-premises
        with:
          authentication: ${{ matrix.authentication }}
        env:
          LC4RI_PLATFORM_HUB: coursewarehub-jupyterhub:${{ github.sha }}
          LC4RI_PLATFORM_AUTH: coursewarehub-auth-proxy:${{ github.sha }}
